name: iOS IPA

# Manual run only. Builds the signed release IPA for the Pace Calendar store package.
# Target location in repo: support897/adhd-calendar-app at .github/workflows/ios-ipa.yml
# (kept here until it is placed via the signed-in GitHub web session — the API
# token has no workflow permission; secrets are already set on the repo).
#
# Mirrors the programme's iOS pipeline (Needs Me ios-ipa.yml) and the Android
# AAB layout (package under store/): signing material arrives from repo
# secrets and never touches the repo itself. The web tree bundled into the
# app is store/www/ — byte-identical to the certified Pace v16-1 web build
# (service-worker CACHE "pace-v16-1"; the same www/ the certified AAB
# 3897ec22… was built from, verified byte-for-byte before commit fcd668c8).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and sync iOS
        working-directory: store
        run: |
          npm ci
          npx cap sync ios

      - name: Write signing material from secrets
        env:
          DIST_CERT_P12_B64: ${{ secrets.DIST_CERT_P12_B64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          echo "$DIST_CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$PROVISIONING_PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Switch the App target to manual distribution signing (CI copy only)
        working-directory: store
        run: |
          perl -pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = GZ9Z6BPTFR;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "Pace Calendar App Store";/' ios/App/App.xcodeproj/project.pbxproj
          perl -pi -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/' ios/App/App.xcodeproj/project.pbxproj
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj | sort -u

      - name: Archive the app (Release, distribution signing)
        working-directory: store
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive"

      - name: Export the IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>GZ9Z6BPTFR</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>shop.ilseplacencia.pace</key>
              <string>Pace Calendar App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: pace-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_API_KEY_P8_B64" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          set +e
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          ALTOOL_STATUS=$?
          set -e
          echo "altool exit code: $ALTOOL_STATUS"
          exit "$ALTOOL_STATUS"
