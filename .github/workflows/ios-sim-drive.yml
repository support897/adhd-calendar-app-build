name: iOS Simulator DRIVE (Pace, QA)

# Manual run only. QA Tester's drive lane, v3 — BUILD/DRIVE SPLIT.
# This workflow does NOT build the app. It downloads the standing
# simulator copy named in qa-drive/pace-copy-manifest.json (candidate
# 22's copy: ios-sim.yml run 39608338150, built from bridge commit
# dc7fbf45), asserts the downloaded artefact zip's sha256 AND the
# inner app zip's sha256 against the manifest BEFORE anything is
# installed, then boots a simulator, installs the proven bytes, and
# drives the email door + a short journey with Maestro
# (qa-drive/pace-drive.yaml v3: Welcome sheet, then the Skip tour
# leg, then the spine). Stage screenshots + the Maestro record
# upload as the pace-sim-drive artefact on EVERY outcome, pass or
# fail, so QA scores from evidence. Test lane only: a pass here
# proves journeys, buttons, saving and deleting ON A SIMULATOR; it
# proves nothing about the real-phone door, whose pass lives on the
# device lane alone.
# The device build + ios-ipa.yml + ios-sim.yml are untouched by this file.
# Credentials: the tester password reaches the drive only through the
# repo secret QA_PACE_TEST_PASSWORD (sealed by QA; the tester is a
# QA-created test account under the tester-account ruling, its cast
# held in QA's test record, never in this repo).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  drive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Guard the tester secret
        env:
          TEST_PASSWORD: ${{ secrets.QA_PACE_TEST_PASSWORD }}
          TEST_PASSWORD2: ${{ secrets.QA_PACE_TEST_PASSWORD2 }}
        run: |
          if [ -z "$TEST_PASSWORD" ] || [ -z "$TEST_PASSWORD2" ]; then
            echo "::error::QA_PACE_TEST_PASSWORD secret is not set on this repo; the drive cannot sign in. QA seals it; nothing else is missing."
            exit 1
          fi
          echo "Tester secret present."

      - name: Fetch the standing copy and prove its hash (manifest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST="qa-drive/pace-copy-manifest.json"
          ARTEFACT_ID=$(jq -r .artefactId "$MANIFEST")
          WANT_SHA=$(jq -r .artefactSha256 "$MANIFEST")
          APP_ZIP_SHA=$(jq -r .appZipSha256 "$MANIFEST")
          echo "Manifest names artefact $ARTEFACT_ID, sha256 $WANT_SHA"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTEFACT_ID/zip" \
            -o "$RUNNER_TEMP/pace-sim-copy-artefact.zip"
          GOT_SHA=$(shasum -a 256 "$RUNNER_TEMP/pace-sim-copy-artefact.zip" | awk '{print $1}')
          echo "Downloaded artefact sha256: $GOT_SHA"
          if [ "$GOT_SHA" != "$WANT_SHA" ]; then
            echo "::error::Standing copy hash mismatch — refusing to install unproven bytes."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/copy" "$RUNNER_TEMP/app"
          unzip -q "$RUNNER_TEMP/pace-sim-copy-artefact.zip" -d "$RUNNER_TEMP/copy"
          INNER_SHA=$(shasum -a 256 "$RUNNER_TEMP/copy/pace-sim-app.zip" | awk '{print $1}')
          echo "Inner app zip sha256: $INNER_SHA"
          if [ "$INNER_SHA" != "$APP_ZIP_SHA" ]; then
            echo "::error::Inner app zip hash mismatch — refusing to install unproven bytes."
            exit 1
          fi
          ditto -x -k "$RUNNER_TEMP/copy/pace-sim-app.zip" "$RUNNER_TEMP/app"
          ls -ld "$RUNNER_TEMP/app/App.app"

      - name: Boot a simulator and install the copy
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/app/App.app"
          echo "App: $APP_PATH"
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", "devices", "available"]))
          best = None
          for runtime, devs in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      ver = runtime.rsplit("-", 1)[-1]
                      if best is None or ver > best[0]:
                          best = (ver, d["udid"], d["name"])
          print(best[1])
          PY
          )
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install booted "$APP_PATH"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Drive the email door + journey (Maestro)
        env:
          TEST_EMAIL: "placenciailse.qa.pace@gmail.com"
          TEST_PASSWORD: ${{ secrets.QA_PACE_TEST_PASSWORD }}
          TEST_EMAIL2: "placenciailse.qa.pace2@gmail.com"
          TEST_PASSWORD2: ${{ secrets.QA_PACE_TEST_PASSWORD2 }}
          MAESTRO_DRIVER_START_TIMEOUT: "180"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
        run: |
          maestro test \
            -e TEST_EMAIL="$TEST_EMAIL" \
            -e TEST_PASSWORD="$TEST_PASSWORD" \
            -e TEST_EMAIL2="$TEST_EMAIL2" \
            -e TEST_PASSWORD2="$TEST_PASSWORD2" \
            qa-drive/pace-spine-completion.yaml

      - name: Collect the drive record
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/drive-record"
          find "$HOME/.maestro" -name "*.png" -exec cp {} "$RUNNER_TEMP/drive-record/" \; 2>/dev/null || true
          # Step records only (hierarchy dumps). commands.json is NEVER
          # collected: Maestro records the drive env (incl. the tester
          # password) in plaintext in it — v1's artefact carried it and
          # the value had to be treated as burnt (QA, 22 Oct).
          find "$HOME/.maestro" -name "step-*.json" -exec cp {} "$RUNNER_TEMP/drive-record/" \; 2>/dev/null || true
          xcrun simctl io booted screenshot "$RUNNER_TEMP/drive-record/final-frame.png" || true
          ls -la "$RUNNER_TEMP/drive-record/" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pace-sim-drive
          path: ${{ runner.temp }}/drive-record/
          if-no-files-found: warn
          retention-days: 30
