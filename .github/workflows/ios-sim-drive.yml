name: iOS Simulator DRIVE (Pace, QA)

# Manual run only. QA Tester's drive lane: builds the SAME unsigned
# simulator copy as ios-sim.yml (candidate 22's exact tree), boots a
# simulator, installs it, then drives the email door + a short journey
# with Maestro (qa-drive/pace-drive.yaml): sign in (the one button also
# makes the account on first run) -> create a task -> sign out -> sign
# in -> the task stands. Stage screenshots + the Maestro record upload
# as the pace-sim-drive artefact on EVERY outcome, pass or fail, so QA
# scores from evidence. Test lane only: a pass here proves journeys,
# buttons, saving and deleting ON A SIMULATOR; it proves nothing about
# the real-phone door, whose pass lives on the device lane alone.
# The device build + ios-ipa.yml + ios-sim.yml are untouched by this file.
# Credentials: the tester password reaches the drive only through the
# repo secret QA_PACE_TEST_PASSWORD (sealed by QA; the tester is a
# QA-created test account under the tester-account ruling, its cast
# held in QA's test record, never in this repo).

on:
  workflow_dispatch:

jobs:
  drive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Guard the tester secret
        env:
          TEST_PASSWORD: ${{ secrets.QA_PACE_TEST_PASSWORD }}
        run: |
          if [ -z "$TEST_PASSWORD" ]; then
            echo "::error::QA_PACE_TEST_PASSWORD secret is not set on this repo; the drive cannot sign in. QA seals it; nothing else is missing."
            exit 1
          fi
          echo "Tester secret present."

      - name: Install dependencies and sync iOS
        working-directory: store
        run: |
          npm ci
          npx cap sync ios

      - name: Build the simulator copy (no signing)
        working-directory: store
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/sim-build" \
            CODE_SIGNING_ALLOWED=NO
          find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "*.app" -print

      - name: Boot a simulator and install the copy
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "App.app" | head -1)
          echo "App: $APP_PATH"
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", "devices", "available"]))
          best = None
          for runtime, devs in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      ver = runtime.rsplit("-", 1)[-1]
                      if best is None or ver > best[0]:
                          best = (ver, d["udid"], d["name"])
          print(best[1])
          PY
          )
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install booted "$APP_PATH"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Drive the email door + journey (Maestro)
        env:
          TEST_EMAIL: "placenciailse.qa.pace@gmail.com"
          TEST_PASSWORD: ${{ secrets.QA_PACE_TEST_PASSWORD }}
          MAESTRO_DRIVER_START_TIMEOUT: "180"
        run: |
          maestro test \
            -e TEST_EMAIL="$TEST_EMAIL" \
            -e TEST_PASSWORD="$TEST_PASSWORD" \
            qa-drive/pace-drive.yaml

      - name: Collect the drive record
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/drive-record"
          find "$HOME/.maestro" -name "*.png" -exec cp {} "$RUNNER_TEMP/drive-record/" \; 2>/dev/null || true
          find "$HOME/.maestro" -name "*.json" -exec cp {} "$RUNNER_TEMP/drive-record/" \; 2>/dev/null || true
          xcrun simctl io booted screenshot "$RUNNER_TEMP/drive-record/final-frame.png" || true
          ls -la "$RUNNER_TEMP/drive-record/" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pace-sim-drive
          path: ${{ runner.temp }}/drive-record/
          if-no-files-found: warn
          retention-days: 30
