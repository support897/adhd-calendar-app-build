# Pace simulator drive v5 — QA Tester chair.
# v5 (2026-10-23) — v4 FAILED-INSTRUMENT at run 39944344163,
# step-016 (the "Account" assert): the Settings route PROVED OUT
# (the Settings page stood whole in the frames — tour leg, sidebar
# and Settings tap all passed), but the Account group sits BELOW
# the fold on the long Settings page and the WebView tree holds
# only rendered content (the failure hierarchy holds "Account"
# ZERO times). v5 cures: (a) the entry leg scrolls until "Account"
# stands (scrollUntilVisible) instead of waiting for it; (b) the
# sign-out leg scrolls until "Sign out" stands; (c) the fleet
# hideKeyboard cure (3 sites) — the class is proven systemically
# elsewhere, so Pace's uncured vote is retired and the cure rides
# prophylactically. v4: 4,449 B / 53 commands.
# v3 change from v2's own run record (run 39938033876, FAILED at step
# 011 "Sign in", INSTRUMENT): after the Welcome sheet is dismissed,
# build 22 presents the Skip mascot TOUR (name step: "Ahoy! I'm Skip.
# Welcome aboard! What's your name?" with "Skip tour" / "Next"). v2
# had no tour leg, so the modal tour stood through the sidebar tap
# and the "Sign in" tap failed behind it; the final frame shows the
# tour untouched. v3 adds the tour leg immediately after the Welcome
# dismissal: wait for "Skip tour", tap it, prove it is gone. Pace's
# bytes were never charged — the app launched and rendered its
# calendar + tour correctly in every frame.
# v2 changes from v1's own run record (run 39638113168, FAILED at the
# Welcome sheet): v1's optional "Not now" tap fired before the sheet
# settled (step status WARNED; the sheet stands untouched in the
# failure frame). v2 WAITS for the sheet, taps non-optionally, and
# proves the sheet is gone before touching anything behind it. Every
# later tap waits until its target is visible.
# Drives candidate 22's simulator copy: email door (the one button
# signs in or makes the account) + a short journey (create -> sign
# out -> sign in -> data stands). Screenshots land after every stage.
# TEST_EMAIL / TEST_PASSWORD arrive as workflow env from the repo
# secret QA_PACE_TEST_PASSWORD + the tester alias of record; the
# values never appear in this file or the repo. NOTE: Maestro's
# commands.json records env values in plaintext — the workflow's
# collect step must NOT upload commands.json (see ios-sim-drive.yml).
appId: shop.ilseplacencia.pace
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Welcome to Pace Calendar"
    timeout: 90000
- takeScreenshot: 00-launched
- tapOn:
    text: "Not now"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Welcome to Pace Calendar"
    timeout: 30000
- takeScreenshot: 01-welcome-done
- extendedWaitUntil:
    visible:
      text: "Skip tour"
    timeout: 30000
- tapOn:
    text: "Skip tour"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Skip tour"
    timeout: 30000
- takeScreenshot: 01b-tour-done
- tapOn:
    point: "8%, 10%"
- takeScreenshot: 02-sidebar
# v4 correction (drives v2+v3 both died at the bare sidebar "Sign in"
# tap): build 22's sidebar carries NO sign-in item — proven from the
# v3 failure frame + hierarchy (zero "Sign in" in tree) and from the
# shipped markup: the account door lives in Settings (#accountGroup:
# accountLine + the #accountOpen button labelled "Sign in").
- tapOn:
    text: "Settings"
    waitUntilVisible: true
- scrollUntilVisible:
    element:
      text: "Account"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 02b-settings-account
- tapOn:
    text: "Sign in"
    waitUntilVisible: true
- takeScreenshot: 03-auth-sheet
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Your password"
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 62%"
- takeScreenshot: 04-auth-filled
- tapOn:
    text: "Continue"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 60000
- takeScreenshot: 05-signed-in
- tapOn:
    point: "8%, 10%"
- takeScreenshot: 06-menu-closed
- tapOn:
    point: "37%, 26%"
- takeScreenshot: 07-add-sheet
- tapOn:
    text: "e.g. Ring the plumber tomorrow at 9am for 30 minutes"
    waitUntilVisible: true
- inputText: "Sim drive task one"
- tapOn:
    point: "90%, 62%"
- tapOn:
    text: "Add task"
    waitUntilVisible: true
- assertVisible:
    text: "Sim drive task one"
- takeScreenshot: 08-task-created
- tapOn:
    point: "8%, 10%"
- tapOn:
    text: "Settings"
    waitUntilVisible: true
- scrollUntilVisible:
    element:
      text: "Sign out"
    direction: DOWN
    timeout: 60000
- tapOn:
    text: "Sign out"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign in"
    timeout: 30000
- takeScreenshot: 09-signed-out
- tapOn:
    text: "Sign in"
    waitUntilVisible: true
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Your password"
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 62%"
- tapOn:
    text: "Continue"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 60000
- takeScreenshot: 10-relogin
- tapOn:
    point: "8%, 10%"
- assertVisible:
    text: "Sim drive task one"
- takeScreenshot: 11-task-stands
