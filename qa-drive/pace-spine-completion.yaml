# Pace SPINE-COMPLETION drive — QA Tester chair.
# v11 (2026-10-23) — carries pace-drive v11's FULL-NODE
# completion at its three tour-skip notVisible targets.
# v10 (2026-10-23) — carries pace-drive v10's relocated
# signed-in proofs (all three of this file's "Sign out" waits
# stood on the calendar, where the string never lives; drive 9
# exposed it). Proofs now run through Settings' Account group
# and return via the sidebar's Calendar item.
# v9 (2026-10-23) — carries pace-drive v9's first-entry tour
# skip at all three entries (drive 8's lesson: the mascot
# tour is the account's first inside surface and occludes the
# tree until skipped; the block is conditional — an account
# whose tour is done never shows it). v8: 11,156 B.
# v8 (2026-10-23) — carries pace-drive v8's sheet-standing cure
# at its three sidebar entries (proof heading "How it looks" +
# the conditional sidebar recovery) after drive 7's Settings
# tap race on the main flow. v7: 8,839 B.
# v7 (2026-10-23) — mirrors pace-drive v7's first-entry welcome
# dismissal (drive 6's proof: the Welcome sheet re-stands inside
# after a fresh account's first entry) at its three Continue sites
# BEFORE its first dispatch. v6: 7,015 B.
# v6 (2026-10-23) — mirrors pace-drive v6's door cure BEFORE its
# first dispatch (the completion flow has never run; its three
# door legs carried the same inherited missing-advance shape that
# killed pace-drive v5 at step-022): focus-race hardening + the
# typed-address landing proof + the "Next" arrow tap + the
# password-step wait on all three door legs, and the door
# password legs' accessory point taps removed under the amended
# dismissal law. The dispatch gate is unchanged: a CLEAN main
# drive (v6) + QA's gate word. v5: 5,741 B / 71 commands.
# v5 (2026-10-23) — mirrors pace-drive v5's proven cures BEFORE its
# first dispatch: scrollUntilVisible for the entry "Account" wait
# and for both "Sign out" legs (the v4 main drive's step-016
# lesson: Pace's Settings tree holds only rendered content; the
# account group lives below the fold) + the fleet hideKeyboard
# cure (4 sites). The standing gate holds: this flow dispatches
# only behind a CLEAN main drive, and its final leg was re-read
# against the main drive's frames at the v4 splice.
# Runs AFTER the main drive (pace-drive.yaml v3) lands clean on the
# same sim copy. Covers the spine legs the single-account drive does
# not: account B's own journey + TWO-WAY isolation against account A.
#   B signs up -> B creates its sentinel ("Sim drive task B") ->
#   B must NOT see A's sentinel ("Sim drive task one") ->
#   sign out -> sign in as A -> A's sentinel stands, B's is absent ->
#   sign out -> sign in as B -> B's sentinel stands.
# Env: TEST_EMAIL / TEST_PASSWORD (account A, repo secret
# QA_PACE_TEST_PASSWORD) + TEST_EMAIL2 / TEST_PASSWORD2 (account B,
# repo secret QA_PACE_TEST_PASSWORD2). Values never appear in this
# file. Maestro's commands.json records env in plaintext — the
# workflow's collect step must NOT upload commands.json.
# DELETE LEG (reserved to QA's chair, NOT in this flow): both
# accounts are deleted through the app's own flow from QA's chair
# against the real backend, closed by the owner-side full-footprint
# 404 read incl. _entitlements (Pace's residue road stands proven).
appId: shop.ilseplacencia.pace
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Welcome to Pace Calendar"
    timeout: 90000
- takeScreenshot: 00-launched
- tapOn:
    text: "Not now"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Welcome to Pace Calendar"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Skip tour"
    timeout: 30000
- tapOn:
    text: "Skip tour"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Skip tour"
    timeout: 30000
- takeScreenshot: 01-inside-clean
- tapOn:
    point: "8%, 10%"
- takeScreenshot: 02-sidebar
# v4 correction (drives v2+v3 both died at the bare sidebar "Sign in"
# tap): build 22's sidebar carries NO sign-in item — proven from the
# v3 failure frame + hierarchy (zero "Sign in" in tree) and from the
# shipped markup: the account door lives in Settings (#accountGroup:
# accountLine + the #accountOpen button labelled "Sign in").
- tapOn:
    text: "Settings"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
# SHEET-STANDING PROOF + RECOVERY (drive 7): the Settings sheet
# is PROVEN standing by its first group heading before any
# scroll — "How it looks" (sheet-only text, read from build
# 22's packaged markup). If it does not stand, the sidebar is
# re-opened and Settings tapped again; the proof then judges.
- runFlow:
    when:
      notVisible: "How it looks"
    commands:
      - tapOn:
          text: "Show the menu"
          waitUntilVisible: true
      - tapOn:
          text: "Settings"
          waitUntilVisible: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "How it looks"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Account"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 02b-settings-account
- tapOn:
    text: "Sign in"
    waitUntilVisible: true
- takeScreenshot: 03-auth-sheet
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "${TEST_EMAIL2}"
- extendedWaitUntil:
