      text: "${TEST_EMAIL2}"
    timeout: 15000
- tapOn:
    text: "Next"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Your password"
    timeout: 30000
- tapOn:
    text: "Your password"
- inputText: "${TEST_PASSWORD2}"
- takeScreenshot: 04-auth-filled-b
