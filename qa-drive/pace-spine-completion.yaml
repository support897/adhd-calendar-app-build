# Pace SPINE-COMPLETION drive — QA Tester chair.
# v5 (2026-10-23) — mirrors pace-drive v5's proven cures BEFORE its
# first dispatch: scrollUntilVisible for the entry "Account" wait
# and for both "Sign out" legs (the v4 main drive's step-016
# lesson: Pace's Settings tree holds only rendered content; the
# account group lives below the fold) + the fleet hideKeyboard
# cure (4 sites). The standing gate holds: this flow dispatches
# only behind a CLEAN main drive, and its final leg was re-read
# against the main drive's frames at the v4 splice.
# Runs AFTER the main drive (pace-drive.yaml v3) lands clean on the
# same sim copy. Covers the spine legs the single-account drive does
# not: account B's own journey + TWO-WAY isolation against account A.
#   B signs up -> B creates its sentinel ("Sim drive task B") ->
#   B must NOT see A's sentinel ("Sim drive task one") ->
#   sign out -> sign in as A -> A's sentinel stands, B's is absent ->
#   sign out -> sign in as B -> B's sentinel stands.
# Env: TEST_EMAIL / TEST_PASSWORD (account A, repo secret
# QA_PACE_TEST_PASSWORD) + TEST_EMAIL2 / TEST_PASSWORD2 (account B,
# repo secret QA_PACE_TEST_PASSWORD2). Values never appear in this
# file. Maestro's commands.json records env in plaintext — the
# workflow's collect step must NOT upload commands.json.
# DELETE LEG (reserved to QA's chair, NOT in this flow): both
# accounts are deleted through the app's own flow from QA's chair
# against the real backend, closed by the owner-side full-footprint
# 404 read incl. _entitlements (Pace's residue road stands proven).
appId: shop.ilseplacencia.pace
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Welcome to Pace Calendar"
    timeout: 90000
- takeScreenshot: 00-launched
- tapOn:
    text: "Not now"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Welcome to Pace Calendar"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Skip tour"
    timeout: 30000
- tapOn:
    text: "Skip tour"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Skip tour"
    timeout: 30000
- takeScreenshot: 01-inside-clean
- tapOn:
    point: "8%, 10%"
- takeScreenshot: 02-sidebar
# v4 correction (drives v2+v3 both died at the bare sidebar "Sign in"
# tap): build 22's sidebar carries NO sign-in item — proven from the
# v3 failure frame + hierarchy (zero "Sign in" in tree) and from the
# shipped markup: the account door lives in Settings (#accountGroup:
# accountLine + the #accountOpen button labelled "Sign in").
- tapOn:
    text: "Settings"
    waitUntilVisible: true
- scrollUntilVisible:
    element:
      text: "Account"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 02b-settings-account
- tapOn:
    text: "Sign in"
    waitUntilVisible: true
- takeScreenshot: 03-auth-sheet
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL2}"
- tapOn:
    text: "Your password"
- inputText: "${TEST_PASSWORD2}"
- tapOn:
    point: "90%, 62%"
- takeScreenshot: 04-auth-filled-b
- tapOn:
    text: "Continue"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 60000
- takeScreenshot: 05-signed-in-b
- tapOn:
    point: "8%, 10%"
- takeScreenshot: 06-menu-closed-b
- tapOn:
    point: "37%, 26%"
- takeScreenshot: 07-add-sheet-b
- tapOn:
    text: "e.g. Ring the plumber tomorrow at 9am for 30 minutes"
    waitUntilVisible: true
- inputText: "Sim drive task B"
- tapOn:
    point: "90%, 62%"
- tapOn:
    text: "Add task"
    waitUntilVisible: true
- assertVisible:
    text: "Sim drive task B"
- takeScreenshot: 08-task-b-created
- assertNotVisible:
    text: "Sim drive task one"
- takeScreenshot: 09-b-isolation
- tapOn:
    point: "8%, 10%"
- tapOn:
    text: "Settings"
    waitUntilVisible: true
- scrollUntilVisible:
    element:
      text: "Sign out"
    direction: DOWN
    timeout: 60000
- tapOn:
    text: "Sign out"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign in"
    timeout: 30000
- takeScreenshot: 10-signed-out-b
- tapOn:
    text: "Sign in"
    waitUntilVisible: true
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL}"
- tapOn:
    text: "Your password"
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 62%"
- tapOn:
    text: "Continue"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 60000
- takeScreenshot: 11-relogin-a
- tapOn:
    point: "8%, 10%"
- assertVisible:
    text: "Sim drive task one"
- assertNotVisible:
    text: "Sim drive task B"
- takeScreenshot: 12-a-isolation
# Sign-out rides the Settings route here too (v4 correction): the
# point tap above opened the sidebar; "Sign out" stands in Settings'
# account group, never in the sidebar. To be re-read against the v4
# main drive's frames before this flow dispatches (its standing gate).
- tapOn:
    text: "Settings"
    waitUntilVisible: true
- scrollUntilVisible:
    element:
      text: "Sign out"
    direction: DOWN
    timeout: 60000
- tapOn:
    text: "Sign out"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign in"
    timeout: 30000
- tapOn:
    text: "Sign in"
    waitUntilVisible: true
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL2}"
- tapOn:
    text: "Your password"
- inputText: "${TEST_PASSWORD2}"
- tapOn:
    point: "90%, 62%"
- tapOn:
    text: "Continue"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 60000
- tapOn:
    point: "8%, 10%"
- assertVisible:
    text: "Sim drive task B"
- takeScreenshot: 13-b-task-stands
